services:
  - type: web
    name: vektorcode-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python agent_api.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VEKTOR_MODE
        value: "cloud"
      - key: VEKTOR_ROLE
        value: "coder"
      - key: VEKTORCODE_TOOL_PASSWORD
        sync: false
