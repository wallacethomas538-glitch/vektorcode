services:
  - type: web
    name: vektorcode-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: VEKTORCODE_TOOL_PASSWORD
        sync: false
      - key: VEKTORCODE_PUBLIC_URL
        sync: false
