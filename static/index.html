<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VektorCode // Cyber-Command</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="nexus-container">
        <!-- LEFT PANEL: THE MIND -->
        <aside class="mind-panel">
            <div class="panel-header">
                <img src="vektor-logo.webp" alt="Vektor Logo" class="logo">
                <span class="brand">VektorCode <small>v2.0</small></span>
            </div>
            
            <div class="section-label">SESSIONS</div>
            <div id="session-list" class="session-list">
                <!-- Sessions loaded via JS -->
            </div>
            
            <div class="section-label">THE BRAIN</div>
            <div class="model-selector">
                <select id="active-model" onchange="changeModel(this.value)">
                    <!-- Models loaded via JS -->
                </select>
            </div>

            <div class="agent-vitals">
                <div class="vital"><span class="dot online"></span> Engine: Online</div>
                <div class="vital"><span class="dot"></span> MCP: <span id="mcp-status">Checking...</span></div>
                <div class="vital"><span class="dot"></span> Rotation: Active</div>
            </div>
        </aside>

        <!-- CENTER PANEL: COLLABORATION ZONE -->
        <main class="collab-zone">
            <header class="collab-header">
                <div class="chat-info">
                    <span class="agent-name">VektorCode</span>
                    <span class="agent-status">Master Architect // Active</span>
                </div>
                <div class="header-actions">
                    <button onclick="clearChat()" class="btn-icon" title="Clear Chat"><i class="fas fa-trash"></i></button>
                    <button onclick="openSettings()" class="btn-icon" title="Settings"><i class="fas fa-cog"></i></button>
                </div>
            </header>

            <div id="chat-flow" class="chat-flow">
                <!-- Messages appear here -->
            </div>

            <div class="input-area">
                <div class="input-wrapper">
                    <button id="tool-toggle" class="btn-tool" title="Toggle Tools"><i class="fas fa-tools"></i></button>
                    <textarea id="user-input" placeholder="Command the Super Agent... (Cmd+K for palette)" onkeydown="handleInput(event)"></textarea>
                    <button id="send-btn" onclick="sendMessage()" class="btn-send"><i class="fas fa-paper-plane"></i></button>
                </div>
                <div class="input-footer">
                    <span>VektorFlow AI Systems // Codex-Savant Engine</span>
                </div>
            </div>
        </main>

        <!-- RIGHT PANEL: THE FORGE -->
        <aside class="forge-panel">
            <div class="panel-header">
                <span class="brand">THE FORGE</span>
                <button onclick="closeForge()" class="btn-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="forge-content">
                <div id="forge-meta" class="forge-meta">No code in forge</div>
                <pre id="forge-code" class="forge-code"><code>// Code will be synthesized here...</code></pre>
                <div class="forge-actions">
                    <button onclick="copyForge()" class="btn-forge"><i class="fas fa-copy"></i> Copy</button>
                    <button onclick="applyForge()" class="btn-forge btn-apply"><i class="fas fa-magic"></i> Apply to System</button>
                </div>
            </div>
        </aside>
    </div>

    <!-- COMMAND PALETTE (MODAL) -->
    <div id="command-palette" class="palette-overlay" style="display:none;">
        <div class="palette-window">
            <input type="text" id="palette-search" placeholder="Search actions..." oninput="filterPalette()">
            <div id="palette-results" class="palette-results">
                <!-- Results via JS -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
